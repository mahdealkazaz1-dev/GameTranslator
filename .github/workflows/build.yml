name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Latest Project Zip
        run: |
          LATEST_ZIP=$(printf "%s\n" GameTranslator*.zip | sort -V | tail -n 1)
          echo "Extracting: $LATEST_ZIP"
          unzip -q -o "$LATEST_ZIP" -d .

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Fixed Keystore
        run: |
          mkdir -p ~/.android
          echo "" | base64 -d > ~/.android/debug.keystore

      - name: Auto Increment Version Code
        run: |
          sed -i "s/versionCode = 1/versionCode = ${{ github.run_number }}/" GameTranslator/app/build.gradle.kts

      - name: Download Gradle 8.7
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip

      - name: Build APK
        working-directory: GameTranslator
        run: |
          ../gradle-8.7/bin/gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GameTranslator-APK
          path: GameTranslator/app/build/outputs/apk/debug/*.apk
